# Sin credenciales: DB_URL, DB_USER y DB_PASSWORD vienen del entorno.
# Esquema gestionado por Flyway (db/migration). Hibernate solo valida.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.flyway.locations=classpath:db/migration

# Errores JSON (RFC 7807) y listados paginados.
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Orígenes del futuro panel web, separados por coma. Los clientes móvil y de escritorio no usan CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
